<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 20" width="100%" height="20">
  <defs>
    <style>
      .dot { }
    </style>
  </defs>
  <g>
    <!-- A row of pixel dots that continuously slides left, looping seamlessly -->
    <g id="dots">
      <!-- Two copies of the same dot row placed back-to-back, animated together, so the loop is seamless -->
      <g transform="translate(0,0)">
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
          from="0 0" to="-40 0" dur="1.2s" repeatCount="indefinite"/>
        <g>
          <!-- repeat unit is 40px wide, colors cycle magenta/cyan/yellow -->
          <circle cx="8" cy="10" r="4" fill="#FF206E" />
          <circle cx="48" cy="10" r="4" fill="#00F5FF" />
          <circle cx="88" cy="10" r="4" fill="#FFD23F" />
          <circle cx="128" cy="10" r="4" fill="#FF206E" />
          <circle cx="168" cy="10" r="4" fill="#00F5FF" />
          <circle cx="208" cy="10" r="4" fill="#FFD23F" />
          <circle cx="248" cy="10" r="4" fill="#FF206E" />
          <circle cx="288" cy="10" r="4" fill="#00F5FF" />
          <circle cx="328" cy="10" r="4" fill="#FFD23F" />
          <circle cx="368" cy="10" r="4" fill="#FF206E" />
          <circle cx="408" cy="10" r="4" fill="#00F5FF" />
          <circle cx="448" cy="10" r="4" fill="#FFD23F" />
          <circle cx="488" cy="10" r="4" fill="#FF206E" />
          <circle cx="528" cy="10" r="4" fill="#00F5FF" />
          <circle cx="568" cy="10" r="4" fill="#FFD23F" />
          <circle cx="608" cy="10" r="4" fill="#FF206E" />
          <circle cx="648" cy="10" r="4" fill="#00F5FF" />
          <circle cx="688" cy="10" r="4" fill="#FFD23F" />
          <circle cx="728" cy="10" r="4" fill="#FF206E" />
          <circle cx="768" cy="10" r="4" fill="#00F5FF" />
        </g>
      </g>
    </g>
  </g>
</svg>
